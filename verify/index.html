body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(148,163,184,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,0.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:-1}

.lang-menu.open{display:flex}

.drop .icon{font-size:34px;display:block;margin-bottom:10px}
.drop input{display:none}

.badge.fail{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#EF4444}
.badge.info{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);color:#D4A017}

<div class="main">

  de: {

};
function t(key, params) {
  var s = (I18N[curLang] && I18N[curLang][key] !== undefined) ? I18N[curLang][key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key);
  if (params) { for (var k in params) { s = s.split('{' + k + '}').join(params[k]); } }
  return s;
}
function applyLang(lang) {
  if (!I18N[lang]) lang = 'zh';
  curLang = lang;
  var dict = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){
    var key = el.getAttribute('data-i18n-html');
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
  document.title = dict.pageTitle || document.title;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  var lbl = document.getElementById('langBtnText');
  if (lbl) lbl.textContent = dict._langName || lang.toUpperCase();
  try { localStorage.setItem('rt_verify_lang', lang); } catch(e) {}
  if (window.RtTimeline && typeof RtTimeline.setLang === 'function') RtTimeline.setLang(lang);
  if (lastResult) renderResult(lastResult.pkg, lastResult.res, lastResult.idCheck);
}
(function(){
  var btn = document.getElementById('langBtn');
  var menu = document.getElementById('langMenu');
  if (!btn || !menu) return;
  btn.addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', function(){ menu.classList.remove('open'); });
  menu.addEventListener('click', function(e){ e.stopPropagation(); });
  menu.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); menu.classList.remove('open'); });
  });
})();
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderResult(pkg, res, idCheck) {
  var ok = res.ok;
  var meta = [
    [t('metaCid'), RtExport.normalizeChainIdDisplay(pkg.chainId || pkg.sessionId || '')],
    [t('metaPk'), pkg.publicKey || pkg.pk || ''],
    [t('metaStamps'), res.totalStamps + (t('stampUnit') ? ' ' + t('stampUnit') : '')],
    [t('metaRtVer'), pkg.rtVersion || ''],
    [t('metaSealed'), pkg.sealedAt || ''],
    [t('metaIdCheck'), idCheck || '—']
  ].filter(function(m) { return m[1] !== undefined && m[1] !== ''; }).map(function(m) {
    return '<div><b>' + m[0] + '</b>' + t('sep') + escapeHtml(String(m[1])) + '</div>';
  }).join('');
  resultEl.innerHTML =
    '<div class="badge ' + (ok ? 'ok' : 'fail') + '">' + (ok ? t('verifyOk') : t('verifyFail')) + '</div>' +
    '<div class="card"><div class="meta">' + meta + '</div></div>' +
    renderTimeline(pkg);
  mountTimeline(pkg);
  lastResult = { pkg: pkg, res: res, idCheck: idCheck };
  if (window.RtDownloader && typeof RtDownloader.render === 'function') {
    var dlBox = document.getElementById('downloadBox');
    if (dlBox) RtDownloader.render(dlBox, { data: pkg, content: _dlContent || '', lang: curLang });
  }
}
// 创作时间轴：复用 core/rt-timeline.js 模块（可缩放直方图，六语标签）
function renderTimeline(pkg) {
  var stamps = (pkg && pkg.stamps) || [];
  if (!stamps || stamps.length === 0) return '';
  return '<div class="card" data-rt-tl-mount="1"></div>';
}
function mountTimeline(pkg) {
  var box = resultEl && resultEl.querySelector('[data-rt-tl-mount]');
  if (!box) return;
  var stamps = (pkg && pkg.stamps) || [];
  if (!stamps || stamps.length === 0) return;
  if (window.RtTimeline && typeof RtTimeline.mount === 'function') {
    RtTimeline.mount(box, stamps);
  }
}
(async function() {
  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('fileInput');

  drop.addEventListener('click', function() { fileInput.click(); });
  drop.addEventListener('dragover', function(e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function() { drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e) {
    e.preventDefault(); drop.classList.remove('over');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) verifyFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) verifyFile(fileInput.files[0]);
  });

  async function verifyFile(file) {
    resultEl.innerHTML = '<div class="badge info">' + t('parsing', { name: escapeHtml(file.name) }) + '</div>';
    var pkg;
    try {
      pkg = await RtExport.loadRtFile(file);
    } catch (e) {
      resultEl.innerHTML = '<div class="badge fail">' + t('parseFail') + escapeHtml(e.message || e) + '</div>';
      return;
    }
    var stamps = (pkg && pkg.stamps) || [];
    var res = await RtVerifier.verifyChain(stamps);
    _dlContent = '';
    renderResult(pkg, res, await checkChainId(pkg));
  }

  async function checkChainId(pkg) {
    var pk = pkg.pk || pkg.publicKey || '';
    var stamps = pkg.stamps || [];
    var last = stamps.length ? stamps[stamps.length - 1] : null;
    var rootHash = (pkg.hashChain && pkg.hashChain.current) || (last && (last.hash || last.chainHash)) || '';
    var chainId = pkg.chainId || pkg.sessionId || '';
    if (!pk || !rootHash || !chainId) return '—';
    var parts = String(chainId).split('-');
    if (parts.length < 3) return t('legacyId');
    var expected = await RtExport.deriveCid(pk, rootHash);
    return expected === parts[parts.length - 1] ? t('idOk') : t('idFail');
  }

  // 写作页跳转带来会话数据时自动验证
  try {
    var raw = sessionStorage.getItem('rt_cert_data');
    if (raw) {
      var certStore = JSON.parse(raw);
      if (certStore && certStore.stamps && certStore.stamps.length > 0) {
        var res = await RtVerifier.verifyChain(certStore.stamps);
        _dlContent = certStore.content || '';
        renderResult({ chainId: certStore.chainId || '', sessionId: certStore.sessionId, publicKey: certStore.publicKey, stamps: certStore.stamps, rtVersion: certStore.rtVersion || '2.0', sealedAt: certStore.sealedAt || '' }, res, await checkChainId({ chainId: certStore.chainId || '', pk: certStore.publicKey || '', stamps: certStore.stamps || [] }));
        sessionStorage.removeItem('rt_cert_data');
      }
    }
  } catch (e) { /* 忽略会话数据异常 */ }

  applyLang((function(){ try { return localStorage.getItem('rt_verify_lang') || 'zh'; } catch(e){ return 'zh'; } })());
})();
</script>
